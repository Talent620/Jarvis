services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_sales_os
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Optional: run the app in Docker too. For local dev you'll usually run
  # `npm run dev` on the host and only use the db service above.
  # app:
  #   build: .
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #   environment:
  #     DATABASE_URL: postgresql://postgres:postgres@db:5432/ai_sales_os?schema=public
  #     NEXTAUTH_SECRET: please-change-me
  #     NEXTAUTH_URL: http://localhost:3000
  #     AI_PROVIDER: mock
  #   ports:
  #     - "3000:3000"

volumes:
  pgdata:
