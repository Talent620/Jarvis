name: iOS (Capacitor) — build .ipa

# Buduje iOS-ową powłokę Capacitor wokół istniejącego frontendu JARVIS (dist/)
# i tworzy POBIERALNY plik JARVIS-unsigned.ipa jako artefakt.
#
# Nie ma lokalnego macOS — cała kompilacja iOS dzieje się tutaj, na runnerze macOS.
# Artefakt jest NIESYGNOWANY: instaluje się go przez Sideloadly/AltStore (które go
# podpiszą Twoim Apple ID) albo przez TrollStore. Szczegóły: INSTALL.md.

on:
  push:
    branches: [ "claude/ios-app-creation-but55f", main ]
    paths:
      - "*.apk"
      - "package.json"
      - "capacitor.config.json"
      - "ios/**"
      - "scripts/**"
      - ".github/workflows/ios.yml"
  pull_request:
    paths:
      - "*.apk"
      - "package.json"
      - "capacitor.config.json"
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-latest
    timeout-minutes: 35
    env:
      MIC_DESC: "JARVIS wymaga dostępu do mikrofonu, aby słuchać Twoich poleceń."
      SPEECH_DESC: "JARVIS używa rozpoznawania mowy, aby zamieniać Twoje słowa na tekst."
    steps:
      - uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Toolchain info
        run: |
          node --version
          xcodebuild -version
          pod --version || sudo gem install cocoapods

      # 1) Zależności + "build" frontendu.
      #    `npm run build` odtwarza dist/ z pakietu APK (nie trzymamy dist/ w gicie,
      #    bo skompilowany bundle zawiera zaszyty klucz API — patrz README).
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web layer (materializes dist/ from APK)
        run: npm run build

      # 2) Platforma iOS: dodaj jeśli brak, potem zsynchronizuj (kopiuje dist/ + pod install)
      - name: Add iOS platform (if missing)
        run: |
          if [ ! -d "ios/App/App.xcworkspace" ]; then
            npx cap add ios
          fi

      - name: Sync iOS (web assets + pods)
        run: npx cap sync ios

      # 3) Uprawnienia prywatności w Info.plist (idempotentnie, na wszelki wypadek)
      - name: Ensure privacy usage descriptions
        run: |
          PLIST="ios/App/App/Info.plist"
          set_key () {
            /usr/libexec/PlistBuddy -c "Add :$1 string $2" "$PLIST" 2>/dev/null \
              || /usr/libexec/PlistBuddy -c "Set :$1 $2" "$PLIST"
          }
          set_key "NSMicrophoneUsageDescription" "$MIC_DESC"
          set_key "NSSpeechRecognitionUsageDescription" "$SPEECH_DESC"
          echo "----- Info.plist (privacy keys) -----"
          /usr/libexec/PlistBuddy -c "Print :NSMicrophoneUsageDescription" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :NSSpeechRecognitionUsageDescription" "$PLIST"

      # 4) Archiwum niesygnowane (bez konta Apple) + eksport do .ipa
      - name: Archive (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/JARVIS.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" | xcbeautify || \
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/JARVIS.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Package unsigned .ipa
        run: |
          APP_PATH="$RUNNER_TEMP/JARVIS.xcarchive/Products/Applications/App.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::App.app not found in archive"; ls -R "$RUNNER_TEMP/JARVIS.xcarchive/Products" || true; exit 1
          fi
          WORK="$RUNNER_TEMP/ipa"
          rm -rf "$WORK"; mkdir -p "$WORK/Payload"
          cp -R "$APP_PATH" "$WORK/Payload/"
          ( cd "$WORK" && zip -qry "$RUNNER_TEMP/JARVIS-unsigned.ipa" Payload )
          ls -lh "$RUNNER_TEMP/JARVIS-unsigned.ipa"

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-unsigned-ipa
          path: ${{ runner.temp }}/JARVIS-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
