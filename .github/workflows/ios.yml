name: iOS build

# Builds the JARVIS iOS app on a macOS runner.
#  1. Verifies it compiles for the iOS Simulator  ("does it actually build?")
#  2. Produces an UNSIGNED .ipa and uploads it as a single downloadable artifact.
#
# An unsigned .ipa is NOT installable on a stock device directly — it is meant to be
# re-signed by a sideloading tool (AltStore / Sideloadly) or installed via TrollStore.
# See JARVIS-iOS/INSTALL.md for how to turn this into something you can install.

on:
  push:
    branches: [ "claude/ios-app-creation-but55f", main ]
    paths: [ "JARVIS-iOS/**", ".github/workflows/ios.yml" ]
  pull_request:
    paths: [ "JARVIS-iOS/**", ".github/workflows/ios.yml" ]
  workflow_dispatch:

defaults:
  run:
    working-directory: JARVIS-iOS

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Compile for iOS Simulator (build check)
        run: |
          set -o pipefail
          xcodebuild \
            -project JARVIS.xcodeproj \
            -scheme JARVIS \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            clean build \
            CODE_SIGNING_ALLOWED=NO | xcpretty || \
          xcodebuild \
            -project JARVIS.xcodeproj \
            -scheme JARVIS \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            clean build \
            CODE_SIGNING_ALLOWED=NO

      - name: Archive for device (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project JARVIS.xcodeproj \
            -scheme JARVIS \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/JARVIS.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" | xcpretty || \
          xcodebuild \
            -project JARVIS.xcodeproj \
            -scheme JARVIS \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/JARVIS.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Package unsigned .ipa
        run: |
          APP_PATH="$RUNNER_TEMP/JARVIS.xcarchive/Products/Applications/JARVIS.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::JARVIS.app not found in archive"; exit 1
          fi
          WORK="$RUNNER_TEMP/ipa"
          rm -rf "$WORK"; mkdir -p "$WORK/Payload"
          cp -R "$APP_PATH" "$WORK/Payload/"
          ( cd "$WORK" && zip -qry "$RUNNER_TEMP/JARVIS-unsigned.ipa" Payload )
          ls -lh "$RUNNER_TEMP/JARVIS-unsigned.ipa"

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-unsigned-ipa
          path: ${{ runner.temp }}/JARVIS-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
