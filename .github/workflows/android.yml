name: Build Android APK

# Buduje instalacyjny APK JARVIS-a w chmurze GitHub (Android SDK + Gradle gotowe).
# Po zakończeniu pobierz plik z sekcji "Artifacts" w podsumowaniu uruchomienia.

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web + sync Capacitor
        env:
          JARVIS_ANTHROPIC_KEY: ${{ secrets.JARVIS_ANTHROPIC_KEY }}
          JARVIS_GEMINI_KEY: ${{ secrets.JARVIS_GEMINI_KEY }}
          JARVIS_GROQ_KEY: ${{ secrets.JARVIS_GROQ_KEY }}
          JARVIS_CEREBRAS_KEY: ${{ secrets.JARVIS_CEREBRAS_KEY }}
          JARVIS_MISTRAL_KEY: ${{ secrets.JARVIS_MISTRAL_KEY }}
          JARVIS_OPENROUTER_KEY: ${{ secrets.JARVIS_OPENROUTER_KEY }}
          JARVIS_NVIDIA_KEY: ${{ secrets.JARVIS_NVIDIA_KEY }}
          JARVIS_GITHUB_KEY: ${{ secrets.JARVIS_GITHUB_KEY }}
        run: |
          npm run build
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
