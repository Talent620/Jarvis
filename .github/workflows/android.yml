name: Build Android APK

# Buduje instalacyjny APK JARVIS-a w chmurze GitHub (Android SDK + Gradle gotowe).
# Po zakończeniu pobierz plik z sekcji "Artifacts" w podsumowaniu uruchomienia.

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Prepare explicitly configured release signing
        env:
          JARVIS_RELEASE_KEYSTORE_BASE64: ${{ secrets.JARVIS_RELEASE_KEYSTORE_BASE64 }}
          JARVIS_RELEASE_STORE_PASSWORD: ${{ secrets.JARVIS_RELEASE_STORE_PASSWORD }}
          JARVIS_RELEASE_KEY_ALIAS: ${{ secrets.JARVIS_RELEASE_KEY_ALIAS }}
          JARVIS_RELEASE_KEY_PASSWORD: ${{ secrets.JARVIS_RELEASE_KEY_PASSWORD }}
          JARVIS_BUILD_NUMBER: ${{ vars.JARVIS_BUILD_NUMBER }}
          JARVIS_PREVIOUS_VERSION_CODE: ${{ vars.JARVIS_PREVIOUS_VERSION_CODE }}
          JARVIS_RELEASE_CERT_SHA256: ${{ vars.JARVIS_RELEASE_CERT_SHA256 }}
        run: node scripts/prepare-android-signing.cjs

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      # Klucze NIE trafiają do bundla (model BYOK: użytkownik podaje własne, szyfrowane lokalnie;
      # produkcyjne klucze idą przez BFF). Wcześniejsze env JARVIS_*_KEY było martwe i mylące.
      - name: Build web + sync Capacitor
        run: |
          npm run build
          npx cap sync android

      - name: Build release APK with configured identity
        working-directory: android
        env:
          JARVIS_RELEASE_STORE_PASSWORD: ${{ secrets.JARVIS_RELEASE_STORE_PASSWORD }}
          JARVIS_RELEASE_KEY_ALIAS: ${{ secrets.JARVIS_RELEASE_KEY_ALIAS }}
          JARVIS_RELEASE_KEY_PASSWORD: ${{ secrets.JARVIS_RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
