name: Build Android APK

# Buduje instalacyjny APK JARVIS-a w chmurze GitHub (Android SDK + Gradle gotowe).
# Po zakończeniu pobierz plik z sekcji "Artifacts" w podsumowaniu uruchomienia.

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The legacy "tools" package no longer exists in current cmdline-tools; the default
          # "tools platform-tools" makes sdkmanager exit 1 on today's runners.
          packages: "platform-tools"

      - name: Install dependencies
        run: npm ci

      # Klucze NIE trafiają do bundla (model BYOK: użytkownik podaje własne, szyfrowane lokalnie;
      # produkcyjne klucze idą przez BFF). Wcześniejsze env JARVIS_*_KEY było martwe i mylące.
      - name: Build web + sync Capacitor
        run: |
          npm run build
          npx cap sync android

      # RELEASE build. Signed with the production key only when JARVIS_RELEASE_* secrets are set,
      # so updates install over jarvis.apk from Releases. Without secrets the APK is "-nonprod".
      - name: Build release APK
        working-directory: android
        env:
          JARVIS_RELEASE_STORE_PASSWORD: ${{ secrets.JARVIS_RELEASE_STORE_PASSWORD }}
          JARVIS_RELEASE_KEY_PASSWORD: ${{ secrets.JARVIS_RELEASE_KEY_PASSWORD }}
          JARVIS_RELEASE_KEY_ALIAS: ${{ secrets.JARVIS_RELEASE_KEY_ALIAS || 'jarvis' }}
          JARVIS_RELEASE_KEYSTORE_B64: ${{ secrets.JARVIS_RELEASE_KEYSTORE_B64 }}
        run: |
          # Production signing only when secrets exist; otherwise Gradle builds a "-nonprod"
          # APK signed with the debug key (docs/JARVIS-SECURITY.md).
          if [ -n "$JARVIS_RELEASE_STORE_PASSWORD" ]; then
            if [ -n "$JARVIS_RELEASE_KEYSTORE_B64" ]; then
              printf '%s' "$JARVIS_RELEASE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
              export JARVIS_RELEASE_STORE_FILE="$RUNNER_TEMP/release.jks"
            else
              export JARVIS_RELEASE_STORE_FILE="$GITHUB_WORKSPACE/android/keystore/jarvis.jks"
            fi
          fi
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
