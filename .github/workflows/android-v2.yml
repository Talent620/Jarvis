name: Build Android APK v2 (test, niezależny)

# Buduje OSOBNY, niezależny APK „JARVIS v2" z TEGO SAMEGO kodu, ale z innym appId
# (net.serwer256.jarvis.v2) i nazwą „JARVIS v2" — instaluje się OBOK głównego JARVIS-a,
# nie nadpisuje go. Podpisywany STAŁYM, prywatnym keystore wyłącznie z GitHub Secrets
# (zipalign -p -f 4 → apksigner sign V1+V2+V3 → twarda bramka apksigner verify).

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag GitHub Release dla podpisanego APK"
        required: false
        default: "v4-jarvis-apex-signed"
  push:
    paths:
      - ".github/workflows/android-v2.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER="$(ls -1 "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build web + sync Capacitor
        env:
          JARVIS_LICENSE_REQUIRED: "false" # wersja TESTOWA — bez ekranu aktywacji/klucza
        run: |
          npm run build
          npx cap sync android

      # Tożsamość v2 — TYLKO w runnerze (po cap sync). Inny applicationId = osobna instalacja.
      - name: Nadaj tożsamość v2 (appId + nazwa)
        run: |
          sed -i 's/applicationId "net.serwer256.jarvis"/applicationId "net.serwer256.jarvis.v2"/' android/app/build.gradle
          sed -i 's#<string name="app_name">JARVIS</string>#<string name="app_name">JARVIS v2</string>#' android/app/src/main/res/values/strings.xml
          sed -i 's#<string name="title_activity_main">JARVIS</string>#<string name="title_activity_main">JARVIS v2</string>#' android/app/src/main/res/values/strings.xml
          echo "appId/app_name ustawione na v2:"; grep -E "applicationId|versionCode" android/app/build.gradle

      - name: Build unsigned release APK
        working-directory: android
        env:
          JARVIS_UNSIGNED_FOR_APKSIGNER: "true"
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Align (zipalign) + Sign (apksigner V1+V2+V3) + Verify gate
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::Brak wymaganych sekretów ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD."
            exit 1
          fi

          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          KEYSTORE="$RUNNER_TEMP/jarvis-v2-release.jks"
          UNSIGNED_APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED_APK="$RUNNER_TEMP/jarvis-aligned.apk"
          FINAL_APK="jarvis-v4-apex-signed.apk"

          if [ ! -f "$UNSIGNED_APK" ]; then
            echo "::error::Nie znaleziono $UNSIGNED_APK"
            ls -la android/app/build/outputs/apk/release/
            exit 1
          fi

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"

          # 1) Wyrównanie stron 4-bajtowe (-p dla natywnych .so na Android 11+/15)
          "$ZIPALIGN" -p -f 4 "$UNSIGNED_APK" "$ALIGNED_APK"
          "$ZIPALIGN" -c -v 4 "$ALIGNED_APK" | tail -n 5

          # 2) Podpis schematem V1 + V2 + V3
          "$APKSIGNER" sign \
            --ks "$KEYSTORE" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$FINAL_APK" \
            "$ALIGNED_APK"

          # 3) TWARDA BRAMKA WERYFIKACJI PODPISU (CI przerywa build przy jakimkolwiek błędzie)
          VERIFY_OUT="$("$APKSIGNER" verify --verbose --print-certs "$FINAL_APK" 2>&1)"
          echo "$VERIFY_OUT" | grep -v "^WARNING: META-INF"
          echo "$VERIFY_OUT" | grep -q "Verified using v2 scheme (APK Signature Scheme v2): true"
          echo "$VERIFY_OUT" | grep -q "Verified using v3 scheme (APK Signature Scheme v3): true"
          "$ZIPALIGN" -c 4 "$FINAL_APK"

          SHA="$(sha256sum "$FINAL_APK" | awk '{print $1}')"
          echo "APK_SHA256=$SHA" >> "$GITHUB_ENV"
          ls -lh "$FINAL_APK"
          echo "SHA-256: $SHA"

      - name: Cleanup ephemeral keystore
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/jarvis-v2-release.jks" "$RUNNER_TEMP/jarvis-aligned.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-v4-apex-signed-apk
          path: jarvis-v4-apex-signed.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || 'v4-jarvis-apex-signed' }}
          name: JARVIS v4 Apex Signed (V2+V3, bez klucza licencyjnego)
          body: |
            Podpisany stałym, prywatnym kluczem release (RSA 2048, schematy **V1 + V2 + V3**, wyrównany `zipalign -p -f 4`, zweryfikowany `apksigner verify --verbose`) build **JARVIS v4 Apex** (`net.serwer256.jarvis.v2`, `JARVIS_LICENSE_REQUIRED=false`).

            - **Commit:** `${{ github.sha }}`
            - **SHA-256 (`jarvis-v4-apex-signed.apk`):** `${{ env.APK_SHA256 }}`
            - *Uwaga przy pierwszej instalacji:* jeśli na telefonie jest stara wersja `JARVIS v2` podpisana starym lub tymczasowym kluczem debug, odinstaluj ją raz przed instalacją tego APK; wszystkie kolejne aktualizacje będą się instalować bezpośrednio na nią.
          files: jarvis-v4-apex-signed.apk
          make_latest: false
