name: Build Android APK v2 (test, niezależny)

# Buduje OSOBNY, niezależny APK „JARVIS v2" z TEGO SAMEGO kodu, ale z innym appId
# (net.serwer256.jarvis.v2) i nazwą „JARVIS v2" — instaluje się OBOK głównego JARVIS-a,
# nie nadpisuje go. Zmiany appId/nazwy są robione TYLKO w runnerze CI (ephemeral) przez sed —
# repo, capacitor.config.ts ani android.yml NIE są ruszane. Po zakończeniu pobierz plik
# z sekcji "Artifacts" w podsumowaniu uruchomienia (Actions → ten workflow).

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag GitHub Release dla czystego APK"
        required: false
        default: "v3-jarvis-soul-vision"
  push:
    paths:
      - ".github/workflows/android-v2.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          SDKMANAGER="$(ls -1 "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -n 1)"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build web + sync Capacitor
        env:
          JARVIS_LICENSE_REQUIRED: "false" # wersja TESTOWA — bez ekranu aktywacji/klucza
        run: |
          npm run build
          npx cap sync android

      # Tożsamość v2 — TYLKO w runnerze (po cap sync). Inny applicationId = osobna instalacja.
      - name: Nadaj tożsamość v2 (appId + nazwa)
        run: |
          sed -i 's/applicationId "net.serwer256.jarvis"/applicationId "net.serwer256.jarvis.v2"/' android/app/build.gradle
          sed -i 's#<string name="app_name">JARVIS</string>#<string name="app_name">JARVIS v2</string>#' android/app/src/main/res/values/strings.xml
          sed -i 's#<string name="title_activity_main">JARVIS</string>#<string name="title_activity_main">JARVIS v2</string>#' android/app/src/main/res/values/strings.xml
          echo "appId/app_name ustawione na v2:"; grep applicationId android/app/build.gradle

      - name: Decode optional release keystore (GitHub Secrets)
        env:
          KEYSTORE_B64: ${{ secrets.JARVIS_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/jarvis-release.jks"
            echo "JARVIS_RELEASE_STORE_FILE=$RUNNER_TEMP/jarvis-release.jks" >> "$GITHUB_ENV"
            echo "Używam produkcyjnego keystore z GitHub Secrets."
          else
            echo "Brak sekretu JARVIS_RELEASE_KEYSTORE_BASE64 — build testowy podpisany efemerycznym kluczem debug."
          fi

      # RELEASE z GitHub Secrets lub bezpieczny fallback debug (bez publicznego .jks w repo).
      - name: Build release APK (secrets lub debug fallback)
        working-directory: android
        env:
          JARVIS_RELEASE_STORE_PASSWORD: ${{ secrets.JARVIS_RELEASE_STORE_PASSWORD }}
          JARVIS_RELEASE_KEY_ALIAS: ${{ secrets.JARVIS_RELEASE_KEY_ALIAS }}
          JARVIS_RELEASE_KEY_PASSWORD: ${{ secrets.JARVIS_RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Prepare clean APK + SHA-256
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk jarvis-v3-soul-vision.apk
          SHA="$(sha256sum jarvis-v3-soul-vision.apk | awk '{print $1}')"
          echo "APK_SHA256=$SHA" >> "$GITHUB_ENV"
          ls -lh jarvis-v3-soul-vision.apk
          echo "SHA-256: $SHA"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-v3-soul-vision-apk
          path: jarvis-v3-soul-vision.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || 'v3-jarvis-soul-vision' }}
          name: JARVIS v3 Soul & Vision (bez klucza licencyjnego)
          body: |
            Niezależny build **JARVIS v3 — Sprint 2: Dusza, Autonomia i Oczy** (`net.serwer256.jarvis.v2`, `JARVIS_LICENSE_REQUIRED=false` — działa od razu bez klucza licencyjnego).
            Nowości Sprintu 2:
            - Protokół Mówionej Polszczyzny (`voice_mode`) + 3 tryby osobowości (`BOJOWY`, `KUMPEL`, `ADWOKAT_DIABLA`)
            - Nocny Sen (`sleep_consolidate` + `open_loops` + `user_lessons`) + Budżet Ciszy (max 3/dzień, 22:00–07:00)
            - Rada Ekspertów (`Narada:`) — 3 role równolegle (`Promise.all`) + werdykt <= 30 s i karta 3 opinii
            - Live Vision (`Pokaż Jarvisowi` / `popatrz na to`) + Kolejka Misji w Tle (`mission_queue`)

            - **Commit:** `${{ github.sha }}`
            - **SHA-256 (`jarvis-v3-soul-vision.apk`):** `${{ env.APK_SHA256 }}`
          files: jarvis-v3-soul-vision.apk
          make_latest: false
