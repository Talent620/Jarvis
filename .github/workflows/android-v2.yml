name: Build Android APK v2 (test, niezależny)

# Buduje OSOBNY, niezależny APK „JARVIS v2" z TEGO SAMEGO kodu, ale z innym appId
# (net.serwer256.jarvis.v2) i nazwą „JARVIS v2" — instaluje się OBOK głównego JARVIS-a,
# nie nadpisuje go. Zmiany appId/nazwy są robione TYLKO w runnerze CI (ephemeral) przez sed —
# repo, capacitor.config.ts ani android.yml NIE są ruszane. Po zakończeniu pobierz plik
# z sekcji "Artifacts" w podsumowaniu uruchomienia (Actions → ten workflow).

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/android-v2.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build web + sync Capacitor
        env:
          JARVIS_LICENSE_REQUIRED: "false" # wersja TESTOWA v2 — bez ekranu aktywacji/klucza
        run: |
          npm run build
          npx cap sync android

      # Tożsamość v2 — TYLKO w runnerze (po cap sync). Inny applicationId = osobna instalacja.
      - name: Nadaj tożsamość v2 (appId + nazwa)
        run: |
          sed -i 's/applicationId "net.serwer256.jarvis"/applicationId "net.serwer256.jarvis.v2"/' android/app/build.gradle
          sed -i 's#<string name="app_name">JARVIS</string>#<string name="app_name">JARVIS v2</string>#' android/app/src/main/res/values/strings.xml
          sed -i 's#<string name="title_activity_main">JARVIS</string>#<string name="title_activity_main">JARVIS v2</string>#' android/app/src/main/res/values/strings.xml
          echo "appId/app_name ustawione na v2:"; grep applicationId android/app/build.gradle

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK v2
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-v2-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
