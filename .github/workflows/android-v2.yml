name: Build Android APK v2 (test, niezależny)

# Buduje OSOBNY, niezależny APK „JARVIS v2" z TEGO SAMEGO kodu, ale z innym appId
# (net.serwer256.jarvis.v2) i nazwą „JARVIS v2" — instaluje się OBOK głównego JARVIS-a,
# nie nadpisuje go. Zmiany appId/nazwy są robione TYLKO w runnerze CI (ephemeral) przez sed —
# repo, capacitor.config.ts ani android.yml NIE są ruszane. Po zakończeniu pobierz plik
# z sekcji "Artifacts" w podsumowaniu uruchomienia (Actions → ten workflow).

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/android-v2.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        id: node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup JDK 17
        id: java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        id: sdk
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        id: dependencies
        run: npm ci

      - name: Build web + sync Capacitor
        id: web
        env:
          JARVIS_LICENSE_REQUIRED: "true"
        run: |
          npm run build
          npx cap sync android

      # Tożsamość v2 — TYLKO w runnerze (po cap sync). Inny applicationId = osobna instalacja.
      - name: Nadaj tożsamość v2 (appId + nazwa)
        id: identity
        run: |
          sed -i 's/applicationId "net.serwer256.jarvis"/applicationId "net.serwer256.jarvis.v2"/' android/app/build.gradle
          sed -i 's#<string name="app_name">JARVIS</string>#<string name="app_name">JARVIS v2</string>#' android/app/src/main/res/values/strings.xml
          sed -i 's#<string name="title_activity_main">JARVIS</string>#<string name="title_activity_main">JARVIS v2</string>#' android/app/src/main/res/values/strings.xml
          echo "appId/app_name ustawione na v2:"; grep applicationId android/app/build.gradle

      # Separate debug application; never distribute as the production APK.
      - name: Build separately identified debug APK
        id: apk
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK v2
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-v2-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Report Android v2 build stages
        if: always()
        env:
          NODE_RESULT: ${{ steps.node.outcome }}
          JAVA_RESULT: ${{ steps.java.outcome }}
          SDK_RESULT: ${{ steps.sdk.outcome }}
          DEPENDENCIES_RESULT: ${{ steps.dependencies.outcome }}
          WEB_RESULT: ${{ steps.web.outcome }}
          IDENTITY_RESULT: ${{ steps.identity.outcome }}
          APK_RESULT: ${{ steps.apk.outcome }}
          UPLOAD_RESULT: ${{ steps.upload.outcome }}
        run: |
          printf '## Android v2 test build stages\n\n| Stage | Result |\n| --- | --- |\n' >> "$GITHUB_STEP_SUMMARY"
          for stage in NODE JAVA SDK DEPENDENCIES WEB IDENTITY APK UPLOAD; do
            variable="${stage}_RESULT"
            result="${!variable}"
            printf '| %s | %s |\n' "$stage" "${result:-not-started}" >> "$GITHUB_STEP_SUMMARY"
            if [ "$result" = failure ]; then
              printf '::error title=Android v2 build stage::%s failed. See the named step; this job builds a separate debug application only.\n' "$stage"
            fi
          done
