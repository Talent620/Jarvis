name: Build Ubuntu

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main", "codex/durable-autonomy-*", "codex/skills-integration-*"]
    # Version tags use this same single Ubuntu build job; they do not move latest.
    tags: ["v*"]
    paths:
      - "electron/**"
      - "src/**"
      - "site-os/**"
      - "electron-builder.json"
      - "package.json"
      - "package-lock.json"
      - "scripts/release-linux.cjs"
      - "scripts/linux-after-install.sh"
      - "vite.config.ts"
      - ".github/workflows/ubuntu.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Validate prerelease tag against package version
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { version } = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const tag = process.env.RELEASE_TAG;
          if (tag !== `v${version}` || !/^\d+\.\d+\.\d+-(?:alpha|beta|rc)(?:\.[0-9A-Za-z-]+)*$/.test(version)) {
            console.error('Release blocked: tag must exactly match package.json and identify an alpha, beta or rc prerelease.');
            process.exit(1);
          }
          console.log(`Validated prerelease ${tag}; publication still requires all source and package checks.`);
          NODE
      - name: Check native Ubuntu environment
        run: bash scripts/bootstrap-ubuntu.sh --check
      - run: npm ci
      - name: Verify source
        run: |
          npm test
          npm run lint
      - name: Preserve browser sandbox prerequisite evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-sandbox-prerequisite-ubuntu
          path: QA/runs/browser-session/precondition.json
          if-no-files-found: warn
      - name: Build and verify licensed Linux packages
        run: npm run release:linux
      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-linux
          path: |
            release-desktop/*/JARVIS.AppImage
            release-desktop/*/JARVIS.deb
            release-desktop/*/PROVENANCE.json
            release-desktop/*/SHA256SUMS
          if-no-files-found: error
      - name: Utwórz manifest wersji Linux
        run: |
          node -e 'const fs = require("fs"); const dir = fs.readdirSync("release-desktop").find(n => fs.existsSync(`release-desktop/${n}/PROVENANCE.json`)); const build = JSON.parse(fs.readFileSync(`release-desktop/${dir}/PROVENANCE.json`)).build; fs.writeFileSync("linux.json", JSON.stringify({version: build, iso: build.replace(" ", "T") + ":00Z", url: "https://github.com/Talent620/Jarvis/releases/download/latest/JARVIS.AppImage"}));'
      - name: Publish rolling Linux release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: JARVIS — najnowszy build
          files: |
            release-desktop/*/JARVIS.AppImage
            release-desktop/*/JARVIS.deb
            linux.json
      - name: Publish validated version prerelease
        # A successful run still needs public release/asset/checksum verification.
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: JARVIS ${{ github.ref_name }}
          prerelease: true
          make_latest: "false"
          fail_on_unmatched_files: true
          body: |
            Controlled Linux prerelease built from this version tag after source tests, lint and package validation.

            Download SHA256SUMS and verify the selected package before installation. PROVENANCE.json records the packaged source commit, version and installer verification.

            CI packaging does not establish successful native desktop launch, upgrade/rollback or real-model acceptance. Read the repository QA report for remaining blockers. This prerelease does not update the rolling latest release.

            Included documentation: CHANGELOG-ALPHA2.md, WYDANIE-ALPHA.md (installation, issuer identity, migration and rollback), UMIEJETNOSCI-INTEGRACJE.md, REPORT.md and requirements.json. Prebuilt packages use the repository issuer; local-owner installations should rebuild with their existing issuer as documented.
          files: |
            release-desktop/*/JARVIS.AppImage
            release-desktop/*/JARVIS.deb
            release-desktop/*/PROVENANCE.json
            release-desktop/*/SHA256SUMS
            docs/CHANGELOG-ALPHA2.md
            docs/WYDANIE-ALPHA.md
            docs/UMIEJETNOSCI-INTEGRACJE.md
            QA/autonomia60/durable/REPORT.md
            QA/autonomia60/durable/requirements.json
