<!doctype html>
<html lang="pl">
<head><meta charset="utf-8"><title>JARVIS Bridge</title>
<style>body{font:14px system-ui,sans-serif;margin:16px;min-width:260px}label{display:block;margin:8px 0 4px}input{width:100%;padding:6px;box-sizing:border-box}button{margin-top:12px;padding:6px 12px}#status{margin-top:12px;color:#555}</style>
</head>
<body>
  <h1>JARVIS Bridge</h1>
  <p>Wpisz kod parowania widoczny w JARVIS. Rozszerzenie łączy się tylko z 127.0.0.1.</p>
  <label for="code">Kod parowania</label>
  <input id="code" inputmode="numeric" maxlength="6" autocomplete="off">
  <label for="port">Port</label>
  <input id="port" inputmode="numeric" value="47823">
  <button id="pair">Połącz</button>
  <button id="forget">Zapomnij parowanie</button>
  <div id="status"></div>
  <script src="options.js"></script>
</body>
</html>
