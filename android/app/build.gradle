apply plugin: 'com.android.application'

// Release numbering is explicit: run numbers from separate workflows can collide.
def releaseBuildNo = System.getenv("JARVIS_BUILD_NUMBER")
def previousBuildNo = System.getenv("JARVIS_PREVIOUS_VERSION_CODE")
def buildNo = (releaseBuildNo ?: "56").toInteger()
def releaseStore = System.getenv("JARVIS_RELEASE_STORE_FILE") ?: project.findProperty("JARVIS_RELEASE_STORE_FILE")
def releaseStorePassword = System.getenv("JARVIS_RELEASE_STORE_PASSWORD") ?: project.findProperty("JARVIS_RELEASE_STORE_PASSWORD")
def releaseAlias = System.getenv("JARVIS_RELEASE_KEY_ALIAS") ?: project.findProperty("JARVIS_RELEASE_KEY_ALIAS")
def releaseKeyPassword = System.getenv("JARVIS_RELEASE_KEY_PASSWORD") ?: project.findProperty("JARVIS_RELEASE_KEY_PASSWORD")
def signingReady = [releaseStore, releaseStorePassword, releaseAlias, releaseKeyPassword].every { it != null && !it.toString().isBlank() }
gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.project == project && it.name in ["assembleRelease", "bundleRelease", "packageRelease", "validateSigningRelease"] }) {
        if (!signingReady) throw new GradleException("Release signing requires explicit JARVIS_RELEASE_* configuration; no development-key fallback is allowed.")
        if (releaseBuildNo == null || previousBuildNo == null || buildNo <= previousBuildNo.toInteger() || buildNo > 2100000000) {
            throw new GradleException("Set JARVIS_BUILD_NUMBER greater than the installed JARVIS_PREVIOUS_VERSION_CODE (max 2100000000).")
        }
    }
}

android {
    namespace "net.serwer256.jarvis"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "net.serwer256.jarvis"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode buildNo
        versionName "2.1.0-alpha.6"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Existing signing identity must be supplied explicitly. The exposed development
    // keystore is never a production fallback; license issuer keys are unrelated.
    signingConfigs {
        release {
            if (signingReady) {
                storeFile file(releaseStore)
                storePassword releaseStorePassword
                keyAlias releaseAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

// Niektóre wtyczki (kontakty/kalendarz) ciągną androidx.core 1.15, które wymaga
// compileSdk 35. Trzymamy compileSdk 34 (AGP 8.2.1) i wymuszamy zgodną wersję.
configurations.all {
    resolutionStrategy {
        force "androidx.core:core:1.13.1"
        force "androidx.core:core-ktx:1.13.1"
    }
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
