apply plugin: 'com.android.application'

// Wersja zsynchronizowana z numerem builda CI (GITHUB_RUN_NUMBER / JARVIS_BUILD_NUMBER).
// Fallback 56 — pierwszy bezpieczny build po wycieku w buildach <= 55.
def buildNo = (System.getenv("JARVIS_BUILD_NUMBER") ?: System.getenv("GITHUB_RUN_NUMBER") ?: "56").toInteger()

// Release signing secrets. JARVIS_RELEASE_STORE_FILE switches production signing on; the other
// three values are then mandatory, so a half-configured CI fails loudly instead of silently
// signing with another identity.
def releaseSecret = { String name ->
    def v = System.getenv(name) ?: project.findProperty(name)
    return (v == null || v.toString().isBlank()) ? null : v.toString()
}
def releaseStoreFile = releaseSecret("JARVIS_RELEASE_STORE_FILE")
def hasReleaseSigning = releaseStoreFile != null
if (hasReleaseSigning) {
    ["JARVIS_RELEASE_STORE_PASSWORD", "JARVIS_RELEASE_KEY_ALIAS", "JARVIS_RELEASE_KEY_PASSWORD"].each { name ->
        if (releaseSecret(name) == null) {
            throw new GradleException("JARVIS_RELEASE_STORE_FILE is set but " + name + " is missing.")
        }
    }
} else {
    logger.warn("JARVIS: no release signing secrets, building a NON-PRODUCTION release APK signed with the debug key.")
}

android {
    namespace "net.serwer256.jarvis"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "net.serwer256.jarvis"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode buildNo
        versionName "2.0." + buildNo
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Release signing comes only from secrets (env or gradle.properties). Without them the
    // release build is signed with the local debug key and marked "-nonprod", so it can never
    // be mistaken for (or published as) an update to the production APK. See docs/JARVIS-SECURITY.md.
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseSecret("JARVIS_RELEASE_STORE_PASSWORD")
                keyAlias releaseSecret("JARVIS_RELEASE_KEY_ALIAS")
                keyPassword releaseSecret("JARVIS_RELEASE_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
                versionNameSuffix "-nonprod"
            }
            resValue "bool", "jarvis_production_signing", hasReleaseSigning ? "true" : "false"
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

// Niektóre wtyczki (kontakty/kalendarz) ciągną androidx.core 1.15, które wymaga
// compileSdk 35. Trzymamy compileSdk 34 (AGP 8.2.1) i wymuszamy zgodną wersję.
configurations.all {
    resolutionStrategy {
        force "androidx.core:core:1.13.1"
        force "androidx.core:core-ktx:1.13.1"
    }
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
